function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {setVisible(true);obs.disconnect();}
    }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

          }}
          onMouseEnter={e => e.currentTarget.style.borderColor = tweaks.accentColor}
          onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border)'}
          >
            <span style={{ fontSize: '0.7rem', letterSpacing: '0.12em', textTransform: 'uppercase', color: tweaks.accentColor, fontWeight: 600 }}>{label}</span>
            {href
              ? <a href={href} target="_blank" rel="noopener" style={{ color: 'var(--fg)', textDecoration: 'none', fontSize: '1rem', fontWeight: 500, wordBreak: 'break-all' }}
                  onMouseEnter={e => e.target.style.color = tweaks.accentColor}
                  onMouseLeave={e => e.target.style.color = 'var(--fg)'}
                >{value}</a>
              : <span style={{ color: 'var(--fg)', fontSize: '1rem', fontWeight: 500 }}>{value}</span>
            }
          </div>
        ))}
      </div>
    </section>);

}

// ── Footer ────────────────────────────────────────────────────────────────────
function Footer({ tweaks }) {
  return (
    <footer style={{
      borderTop: '1px solid var(--border)', padding: '2rem',
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      color: 'var(--fg2)', fontSize: '0.8rem',
      maxWidth: '1100px', margin: '0 auto'
    }}>
      <span>© 2026 Pawat Wangsirisuk</span>
      <span style={{ color: tweaks.accentColor }}>Built with ♥</span>
    </footer>);

}

// ── Tweaks Panel ──────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const accentOptions = [
  { label: 'Mint', value: 'oklch(0.78 0.17 158)' },
  { label: 'Sky', value: 'oklch(0.78 0.17 220)' },
  { label: 'Gold', value: 'oklch(0.78 0.17 60)' },
  { label: 'Rose', value: 'oklch(0.78 0.17 10)' },
  { label: 'Violet', value: 'oklch(0.78 0.17 300)' }];

  const update = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };
  return (
    <div style={{
      position: 'fixed', bottom: '2rem', right: '2rem', zIndex: 10000,
      background: 'oklch(0.16 0.01 240)', border: '1px solid var(--border)',
      borderRadius: '1rem', padding: '1.5rem', width: 260,
      boxShadow: '0 20px 60px oklch(0 0 0 / 0.5)',
      fontFamily: 'DM Sans, sans-serif'
    }}>
      <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: '0.85rem', letterSpacing: '0.05em', marginBottom: '1.25rem', color: 'var(--fg)' }}>Tweaks</div>

      <div style={{ marginBottom: '1rem' }}>
        <div style={{ fontSize: '0.72rem', letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--fg2)', marginBottom: '0.6rem' }}>Accent Color</div>
        <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
          {accentOptions.map((opt) =>
          <button key={opt.label} onClick={() => update('accentColor', opt.value)} style={{
            width: 28, height: 28, borderRadius: '50%',
            background: opt.value,
            border: tweaks.accentColor === opt.value ? '2px solid white' : '2px solid transparent',
            cursor: 'pointer', outline: 'none', transition: 'transform 0.15s'
          }}
          onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.2)'}
          onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}
          title={opt.label} />
          )}
        </div>
      </div>

      <label style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', marginTop: '0.75rem' }}>
        <span style={{ fontSize: '0.82rem', color: 'var(--fg2)' }}>Show Availability</span>
        <div onClick={() => update('showAvailability', !tweaks.showAvailability)} style={{
          width: 36, height: 20, borderRadius: '100px',
          background: tweaks.showAvailability ? tweaks.accentColor : 'var(--border)',
          position: 'relative', cursor: 'pointer', transition: 'background 0.2s'
        }}>
          <div style={{
            position: 'absolute', top: 3, left: tweaks.showAvailability ? 18 : 3,
            width: 14, height: 14, borderRadius: '50%', background: 'white',
            transition: 'left 0.2s'
          }} />
        </div>
      </label>
    </div>);

}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    // Register listener first, then announce availability
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Nav tweaks={tweaks} />
      <Hero tweaks={tweaks} />
      {/* Horizontal rule */}
      <div style={{ maxWidth: '1100px', margin: '0 auto 0', height: 1, background: 'var(--border)' }} />
      <Skills tweaks={tweaks} />
      <div style={{ maxWidth: '1100px', margin: '0 auto', height: 1, background: 'var(--border)' }} />
      <Projects tweaks={tweaks} />
      <div style={{ maxWidth: '1100px', margin: '0 auto', height: 1, background: 'var(--border)' }} />
      <Contact tweaks={tweaks} />
      <Footer tweaks={tweaks} />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
